name: Notion Group Sync

on:
  push:
    branches: [ main ]
  issues:
    types: [ opened ]

jobs:
  notion_update:
    runs-on: ubuntu-latest

    steps:
      # Detecta o tipo de evento e monta a mensagem
      - name: Definir mensagem do evento
        id: msg
        run: |
          if [ "${{ github.event_name }}" = "issues" ]; then
            echo "titulo=Tarefa: ${{ github.event.issue.title }}" >> $GITHUB_OUTPUT
            echo "status=Pendente" >> $GITHUB_OUTPUT
          else
            echo "titulo=Push: ${{ github.event.head_commit.message }}" >> $GITHUB_OUTPUT
            echo "status=Enviado" >> $GITHUB_OUTPUT
          fi

      # Envia os dados para o Notion via API
      - name: Enviar para o Notion
        run: |
          curl -s -X POST 'https://api.notion.com/v1/pages' \
            -H 'Authorization: Bearer ${{ secrets.NOTION_TOKEN }}' \
            -H 'Content-Type: application/json' \
            -H 'Notion-Version: 2022-06-28' \
            --data '{
              "parent": { "database_id": "${{ secrets.NOTION_DATABASE_ID }}" },
              "properties": {
                "Name": {
                  "title": [
                    { "text": { "content": "${{ steps.msg.outputs.titulo }}" } }
                  ]
                }
              }
            }'
